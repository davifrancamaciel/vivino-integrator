companies:
  handler: src/functions/api/companies.handler
  events:
    - http:
        path: companies
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: companies
        method: post
        authorizer: verifyToken
        cors: true
    - http:
        path: companies
        method: put
        authorizer: verifyToken
        cors: true
    - http:
        path: companies/{id}
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: companies/{id}
        method: delete
        authorizer: verifyToken
        cors: true
    - http:
        path: companies/all
        method: get
        authorizer: verifyToken
        cors: true
companiesByNamePublic:
  handler: src/functions/api/companies.listByName
  events:
    - http:
        path: companies/public/{name}
        method: get
        cors: true