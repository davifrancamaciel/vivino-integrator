wines:
  handler: src/functions/api/wines.handler
  events:
    - http:
        path: wines
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: wines
        method: post
        authorizer: verifyToken
        cors: true
    - http:
        path: wines
        method: put
        authorizer: verifyToken
        cors: true
    - http:
        path: wines/{id}
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: wines/{id}
        method: delete
        authorizer: verifyToken
        cors: true
    - http:
        path: wines/all
        method: get
        authorizer: verifyToken
        cors: true
winesSaleHistory:
  handler: src/functions/api/winesSaleHistory.list
  timeout: 600 
  events:
    - http:
        path: wines/sale-history
        method: get
        authorizer: verifyToken
        cors: true 
winesSale:
  handler: src/functions/api/winesSale.list
  timeout: 600 
  events:
    - http:
        path: wines/sales
        method: get
        authorizer: verifyToken
        cors: true 