romanians:
  handler: src/functions/api/romanians.handler
  events:
    - http:
        path: romanians
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: romanians
        method: post
        authorizer: verifyToken
        cors: true
    - http:
        path: romanians
        method: put
        authorizer: verifyToken
        cors: true
    - http:
        path: romanians/{id}
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: romanians/{id}
        method: delete
        authorizer: verifyToken
        cors: true