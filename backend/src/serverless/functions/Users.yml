users:
  handler: src/functions/api/users.handler
  events:
    - http:
        path: users
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: users
        method: post
        authorizer: verifyToken
        cors: true
    - http:
        path: users
        method: put
        authorizer: verifyToken
        cors: true
    - http:
        path: users/{id}
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: users/{id}
        method: delete
        authorizer: verifyToken
        cors: true
    - http:
        path: users/all
        method: get
        authorizer: verifyToken
        cors: true