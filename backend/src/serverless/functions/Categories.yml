categories:
  handler: src/functions/api/categories.handler
  events:
    - http:
        path: categories
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: categories
        method: post
        authorizer: verifyToken
        cors: true
    - http:
        path: categories
        method: put
        authorizer: verifyToken
        cors: true
    - http:
        path: categories/{id}
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: categories/{id}
        method: delete
        authorizer: verifyToken
        cors: true
    - http:
        path: categories/all
        method: get
        authorizer: verifyToken
        cors: true