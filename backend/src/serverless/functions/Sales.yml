sales:
  handler: src/functions/api/sales.handler
  events:
    - http:
        path: sales
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: sales
        method: post
        authorizer: verifyToken
        cors: true
    - http:
        path: sales
        method: put
        authorizer: verifyToken
        cors: true
    - http:
        path: sales/{id}
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: sales/{id}
        method: delete
        authorizer: verifyToken
        cors: true
    - http:
        path: sales/public
        method: post
        cors: true