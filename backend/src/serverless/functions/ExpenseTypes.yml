expenseTypes:
  handler: src/functions/api/expenseTypes.handler
  events:
    - http:
        path: expense-types
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: expense-types
        method: post
        authorizer: verifyToken
        cors: true
    - http:
        path: expense-types
        method: put
        authorizer: verifyToken
        cors: true
    - http:
        path: expense-types/{id}
        method: get
        authorizer: verifyToken
        cors: true
    - http:
        path: expense-types/{id}
        method: delete
        authorizer: verifyToken
        cors: true
    - http:
        path: expense-types/all
        method: get
        authorizer: verifyToken
        cors: true
